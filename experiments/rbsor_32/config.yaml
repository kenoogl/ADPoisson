experiment:
  name: sor_32_baseline
  description: red-black sor
problem:
  equation: poisson
  dimension: 3
  domain:
    type: cartesian
    size: [1.0, 1.0, 1.0]
  boundary_condition:
    type: dirichlet
    solution: analytic
discretization:
  grid:
    nx: 32
    ny: 32
    nz: 32
  layout: cell-centered
  ghost_cells: 2
solver:
  method: rbsor
  omega: 1.0
convergence:
  residual_norm: L2
  tolerance: 1.0e-6
  max_iterations: 20000
output:
  results_dir: results/rbsor_32
  save_residual_history: true
postprocess:
  commands:
    - julia --project scripts/history_stats.jl --input-dir results/rbsor_32
