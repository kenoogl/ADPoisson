experiment:
  name: rbssor_n128_omega1.8
  description: ssor
output:
  results_dir: results/rbssor_n128_omega1.8
  save_residual_history: true
execution:
  command: >
    julia --project scripts/run_solver.jl --config experiments/rbssor_n128_omega1.8/config.yaml

postprocess:
  commands:
    - julia --project scripts/history_stats.jl --input-dir results/rbssor_n128_omega1.8
run:
  solver: rbssor
  n: 128
  Fo: 0.5
  omega: 1.8
  max_steps: 20000
  epsilon: 1.0e-8
  alpha: 1.0
  bc_order: spec
  output_dir: results/rbssor_n128_omega1.8
problem:
  equation: poisson
  dimension: 3
  domain:
    type: cartesian
    size: [1.0, 1.0, 1.0]
  boundary_condition:
    type: dirichlet
    solution: analytic
discretization:
  grid:
    nx: 128
    ny: 128
    nz: 128
  layout: cell-centered
  ghost_cells: 2
convergence:
  residual_norm: L2
